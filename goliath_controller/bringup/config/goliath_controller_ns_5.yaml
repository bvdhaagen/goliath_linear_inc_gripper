robot_5:
  controller_manager:
    ros__parameters:
      update_rate: 100  # Hz
       # Existing controllers
      joint_state_broadcaster:
        type: joint_state_broadcaster/JointStateBroadcaster

      position_controller:
        type: position_controllers/JointGroupPositionController

  position_controller:
    ros__parameters:
      joints:
        - robot_5/joint_1
        - robot_5/joint_2
        - robot_5/joint_3
        - robot_5/joint_4
        - robot_5/joint_5
        - robot_5/joint_6
      
        - robot_5/Slider 22
        - robot_5/Slider 23

        - robot_5/slider_11

