robot_3:
  controller_manager:
    ros__parameters:
      update_rate: 100  # Hz
       # Existing controllers
      joint_state_broadcaster:
        type: joint_state_broadcaster/JointStateBroadcaster

      position_controller:
        type: position_controllers/JointGroupPositionController

  position_controller:
    ros__parameters:
      joints:
        - robot_3/joint_1
        - robot_3/joint_2
        - robot_3/joint_3
        - robot_3/joint_4
        - robot_3/joint_5
        - robot_3/joint_6
      
        - robot_3/Slider 22
        - robot_3/Slider 23

        - robot_3/slider_11

